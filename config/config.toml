version = 1
theme = "dark"
terminal_theme = "inherit"
status_visible = true
status_path_depth = 3
status_path_max_length = 40
status_path_align = "right"
status_separator = "powerline"
leader = "C-b"
leader2 = "C-a"
leader3 = "C-m"
notification_history = 200
notifications_enabled = true
notification_timeout_ms = 5000
viewer_cache_mb = 128
viewer_image_max_mb = 32
viewer_prefetch = true
# Pass clicks, drags and wheel events to applications in a pane when the
# application enables mouse tracking. Off keeps Cosmos focus/history handling.
mouse_passthrough = true

# Candidate number glyphs: normal, superscript, subscript (Settings → Input method).
# ime_number_style = "normal"

# Optional independent status button colors. COSMOS defaults to the logo gradient.
# Explicit cosmos color overrides the gradient; other defaults use terminal ANSI.
# [status_colors]
# cosmos = "blue"
# image = "green"
# doc = "green"
# agent = "magenta"
# files = "red"
# foreground = "bright_white"
