version = 1
theme = "dark"
terminal_theme = "inherit"
status_visible = true
leader = "C-b"
notification_history = 200
notifications_enabled = true
notification_timeout_ms = 5000

# Candidate number glyphs: normal, superscript, subscript (Settings → Input method).
# ime_number_style = "normal"

# Optional independent status button colors. COSMOS defaults to the logo gradient.
# Explicit cosmos color overrides the gradient; other defaults use terminal ANSI.
# [status_colors]
# cosmos = "blue"
# image = "green"
# doc = "green"
# agent = "magenta"
# files = "red"
# foreground = "bright_white"
