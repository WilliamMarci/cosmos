version = 1
# Theme ids are TOML file stems in themes/ or ~/.config/cosmos/themes.
# Cosmos: dark, light, midnight, paper. Terminal: inherit, ubuntu,
# cosmos-dark, cosmos-light, solarized-dark, solarized-light,
# gruvbox-dark, nord.
theme = "dark"
terminal_theme = "inherit"
assistant_file_access = "read_only" # none, read_only, read_write; Shell execution stays disabled
files_icons = false # Requires a Nerd Font when enabled
files_border = "dividers" # none, dividers, frame
status_visible = true
status_path_depth = 3
status_path_max_length = 40
status_path_align = "right"
status_separator = "powerline"
leader = "C-b"
leader2 = "C-a"
leader3 = "C-m"
notification_history = 200
notifications_enabled = true
notification_timeout_ms = 5000
viewer_cache_mb = 128
viewer_image_max_mb = 32
viewer_prefetch = true
viewer_disk_cache_mb = 512
viewer_pdf_edge = 2400
viewer_pdf_page_mb = 32
viewer_rich_columns = "auto"
viewer_rich_mode = "pages"
viewer_rich_line_space = 1
viewer_inline_image_rows = 8
viewer_icon_max_px = 64
ui_mod_paths = []
# Pass clicks, drags and wheel events to applications in a pane when the
# application enables mouse tracking. Off keeps Cosmos focus/history handling.
mouse_passthrough = true

# Candidate number glyphs: normal, superscript, subscript (Settings → Input method).
# ime_number_style = "normal"

# Optional independent status button colors. COSMOS defaults to the logo gradient.
# Explicit cosmos color overrides the gradient; other defaults use terminal ANSI.
# [status_colors]
# cosmos = "blue"
# image = "green"
# doc = "green"
# agent = "magenta"
# files = "red"
# foreground = "bright_white"
