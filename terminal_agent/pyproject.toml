[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent"
version = "0.1.0"
description = "A small inline terminal command assistant"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0.48,<4"]

[project.scripts]
agent = "terminal_agent.cli:main"

[tool.setuptools.packages.find]
include = ["terminal_agent*"]
